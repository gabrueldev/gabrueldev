name: Atualizar gráfico de contribuições

on:
  schedule:
    - cron: "17 3 * * *" # todo dia, 00:17 no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/contrib_heatmap.py
      - .github/workflows/contrib-heatmap.yml

permissions:
  contents: write

concurrency:
  group: contrib-heatmap
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/contrib_heatmap.py ${{ github.repository_owner }} contrib-heatmap.svg

      - name: Commit se mudou
        run: |
          if git diff --quiet -- contrib-heatmap.svg && git ls-files --error-unmatch contrib-heatmap.svg >/dev/null 2>&1; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg
          git commit -m "chore: atualiza gráfico de contribuições"
          git push
